<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      .hand { font-family: "Comic Sans MS", "Bradley Hand", "Chalkboard SE", cursive; fill:#181818; }
      .title { font-size:32px; font-weight:700; }
      .label { font-size:18px; font-weight:700; }
      .small { font-size:14px; }
      .tiny { font-size:12px; }
      .box { stroke-width:3; rx:18; ry:18; }
      .thin { stroke-width:2.2; rx:14; ry:14; }
      .dash { stroke-dasharray:10 10; stroke-linecap:round; fill:none; }
      .arrow { fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .arrow2 { fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow2); stroke-dasharray:8 8; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e87812"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8e24aa"/>
    </marker>
