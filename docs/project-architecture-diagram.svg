<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <style>
      @font-face { font-family: "VirgilLocal"; src: url("./assets/Virgil.woff2") format("woff2"); }
      .txt { font-family: "VirgilLocal", "Virgil", "Excalifont", "Comic Sans MS", "Bradley Hand", cursive; fill:#171717; text-anchor:middle; dominant-baseline:middle; }
      .title { font-size:32px; font-weight:700; }
      .section { font-size:22px; font-weight:700; }
      .node { font-size:18px; font-weight:700; }
      .small { font-size:14px; }
      .tiny { font-size:12px; }
      .box { stroke-width:3; rx:22; ry:22; }
      .thin { stroke-width:2.4; rx:16; ry:16; }
      .dash { stroke-dasharray:11 11; stroke-linecap:round; fill:none; }
      .arrow { fill:none; stroke:#e87510; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
