      .title { font-size:32px; font-weight:700; }
      .section { font-size:22px; font-weight:700; }
      .node { font-size:17px; font-weight:700; }
      .small { font-size:13px; }
      .tiny { font-size:11px; }
      .box { stroke-width:3; rx:22; ry:22; }
      .thin { stroke-width:2.4; rx:16; ry:16; }
      .dash { stroke-dasharray:11 11; stroke-linecap:round; fill:none; }
      .arrow { fill:none; stroke:#e87510; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
