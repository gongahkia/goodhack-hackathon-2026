<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1100" viewBox="0 0 1900 1100">
  <defs>
    <style>
      @font-face { font-family: "VirgilLocal"; src: url("./assets/Virgil.woff2") format("woff2"); }
